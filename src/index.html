<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>BRAVISO — Tu dinero, en perspectiva.</title>
    <meta name="description" content="BRAVISO. Tus cuentas, compromisos, créditos e ingresos en un solo lugar. Tu dinero, en perspectiva." />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14251f" media="(prefers-color-scheme: dark)" />

    <!-- PWA Web App Manifest -->
    <link rel="manifest" href="manifest.webmanifest" />

    <!-- Apple iOS Web App Metadata (Standalone Mode) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BRAVISO" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="favicon.ico" />
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
